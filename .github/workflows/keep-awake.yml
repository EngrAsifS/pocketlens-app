# Keeps the free-tier hosting awake without any PC.
#
# Supabase free tier pauses a project after 7 days of no API activity. pg_cron
# jobs run inside the database and do not count, so an outside request is
# needed: this pings Supabase's REST API once a day.
#
# The Render API is kept warm by Supabase pg_cron (see
# finance-backend/supabase/migrations/20260919000000_server_side_scheduler.sql).
# This workflow also pings /health as a backup in case those jobs are off.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       e.g. https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (NOT service_role)
#   API_URL            e.g. https://your-api.onrender.com  (optional)
#
# Run it by hand from the Actions tab to check it works.

name: Keep services awake

on:
  schedule:
    - cron: "17 13 * * *"   # once a day, 13:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are not set"; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            "${SUPABASE_URL%/}/rest/v1/accounts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Supabase ping failed (HTTP $code) - project may be paused"; exit 1; }

      - name: Ping API (backup)
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set; skipping"; exit 0; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "${API_URL%/}/health")
          echo "API /health -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::API health check failed (HTTP $code)"; exit 1; }
